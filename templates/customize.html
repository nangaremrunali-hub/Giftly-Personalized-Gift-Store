{% extends "base.html" %}{% block content %}<section class="custom"><div class="preview"><img src="{{p.photo}}" alt="{{p.name}} product photo" onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/' + p.image) }}';this.classList.add('photo-fallback')"><div><small>LIVE PREVIEW</small><b id="pvname">YOUR STORY</b><span id="pvmsg">made just for someone special</span></div></div><form class="customform" method="post"><small>MAKE IT YOURS</small><h1>Customize<br><i>{{p.name}}</i></h1><p>{{p.desc}}</p><label>Name / Names<input name="name" data-pv="pvname" placeholder="Rahul & Sneha"></label><label>Special date<input name="date" placeholder="14 February 2026"></label><label>Your message<textarea name="message" data-pv="pvmsg" placeholder="Something only they would understand..."></textarea></label><button class="btn dark full">Save personalization & add to cart →</button></form></section>{% endblock %}
